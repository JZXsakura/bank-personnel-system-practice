<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Staff System - Сотрудники</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">B</div>
      <div>
        <strong>Bank Staff</strong>
        <span>HR system</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="index.html">Главная</a>
      <a href="employees.html" class="active">Сотрудники</a>
      <a href="departments.html">Подразделения</a>
      <a href="employee-card.html">Карточка сотрудника</a>
      <a href="statistics.html">Статистика</a>
      <a href="../site/index.html">Сайт проекта</a>
    </nav>
  </aside>

  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Кадровый учет</p>
        <h1>Сотрудники</h1>
      </div>

      <div class="user-panel">
        <span class="user-role">HR-специалист</span>
        <div class="user-avatar">HR</div>
      </div>
    </header>

    <section class="page-panel">
      <div class="panel-header">
        <div>
          <h2>База сотрудников</h2>
          <p>Просмотр, поиск и фильтрация сотрудников банка</p>
        </div>

        <button class="primary-action" type="button">Добавить сотрудника</button>
      </div>

      <div class="filters">
        <input 
          type="text" 
          id="employeeSearch" 
          placeholder="Поиск по ФИО, должности или табельному номеру"
        >

        <select id="departmentFilter">
          <option value="all">Все подразделения</option>
          <option value="HR-отдел">HR-отдел</option>
          <option value="Кредитный отдел">Кредитный отдел</option>
          <option value="Отдел рисков">Отдел рисков</option>
          <option value="IT-отдел">IT-отдел</option>
          <option value="Финансовый отдел">Финансовый отдел</option>
          <option value="Служба безопасности">Служба безопасности</option>
        </select>

        <select id="statusFilter">
          <option value="all">Все статусы</option>
          <option value="Работает">Работает</option>
          <option value="В отпуске">В отпуске</option>
          <option value="На больничном">На больничном</option>
          <option value="В командировке">В командировке</option>
          <option value="Уволен">Уволен</option>
        </select>

        <button id="resetFilters" class="secondary-action" type="button">Сбросить</button>
      </div>

      <div class="table-info">
        <p>Найдено сотрудников: <strong id="employeeCount">0</strong></p>
      </div>

      <div class="table-wrapper">
        <table class="employees-table">
          <thead>
            <tr>
              <th>Таб. номер</th>
              <th>ФИО</th>
              <th>Должность</th>
              <th>Отдел</th>
              <th>Статус</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="employeeTableBody">
            <!-- Данные подставляются через JavaScript -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
